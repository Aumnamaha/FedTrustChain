network_protocol: "UDP"

server:
  host: "127.0.0.1"
  port: 5000
  min_clients: 2
  num_rounds: 1

# Dynamic Node Trust Scoring (Phase 2 Step 1)
# Controls pre-aggregation filtering of adversarial client updates.
trust_threshold: 0.50
reward_rate: 0.05
decay_rate: 0.25
accuracy_delta: 0.15

# Permissioned Blockchain Ledger (Phase 2 Step 2)
# Immutable audit trail for model payload hashes, trust scores, and aggregation decisions.
blockchain_enabled: true
audit_log_path: "results/blockchain_audit_log.json"
mining_difficulty: 2

algorithm: "RandomForestClassifier"
model:
  n_estimators_per_client: 50
  max_depth: 15
  random_state: 42

# All paths are relative to the project root (the directory containing configs/config.yaml).
# Resolution happens in Python code via os.path.join(PROJECT_ROOT, ...) so this
# file stays portable across Windows, Linux, and macOS without any hard-coded separators.
paths:
  dataset_dir: "data/Datasets"
  wustl_ehms: "data/Datasets/wustl-ehms-2020_with_attacks_categories.csv"
  ciciot23: "data/Datasets/train.csv"
  nf_ton_iot: "data/Datasets/NF-ToN-IoT.parquet"
